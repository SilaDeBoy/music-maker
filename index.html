<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Music Maker</h1>
      <p class="subtitle">Create melodies & beats • Record & download</p>
    </header>

    <!-- Controls -->
    <section class="controls">
      <div class="control-group">
        <label>Waveform</label>
        <select id="waveform">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>

      <div class="control-group">
        <label>Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.4" />
      </div>

      <div class="control-group">
        <label>Attack</label>
        <input type="range" id="attack" min="0.01" max="1" step="0.01" value="0.05" />
      </div>

      <div class="control-group">
        <label>Release</label>
        <input type="range" id="release" min="0.05" max="2" step="0.05" value="0.4" />
      </div>
    </section>

    <!-- Piano -->
    <section class="piano-section">
      <h2>Piano</h2>
      <div class="piano" id="piano"></div>
      <p class="hint">Click keys or use keyboard: A S D F G H J K (white) • W E T Y U (black)</p>
    </section>

    <!-- Drum Sequencer -->
    <section class="drums-section">
      <div class="drums-header">
        <h2>Drum Sequencer</h2>
        <div class="seq-controls">
          <button id="playSeq" class="btn primary">▶ Play</button>
          <button id="stopSeq" class="btn">■ Stop</button>
          <label class="tempo-label">
            Tempo
            <input type="range" id="tempo" min="60" max="180" value="120" />
            <span id="tempoValue">120</span> BPM
          </label>
        </div>
      </div>

      <div class="sequencer" id="sequencer">
        <!-- rows will be generated by JS -->
      </div>
    </section>

    <!-- Record -->
    <section class="record-section">
      <h2>Record</h2>
      <div class="record-controls">
        <button id="startRecord" class="btn record">● Record</button>
        <button id="stopRecord" class="btn" disabled>■ Stop</button>
        <a id="downloadLink" class="btn download hidden" download="my-music.webm">⬇ Download</a>
      </div>
      <p id="recordStatus" class="status">Ready to record</p>
    </section>

    <footer>
      <p>Made for GitHub Pages • Pure Web Audio API</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
